apply plugin: 'com.android.application'

// Signing credentials live outside version control (keystore.properties is git-ignored).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.wunelezi.plus'
    compileSdk 34

    defaultConfig {
        applicationId "com.wunelezi.plus"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }
}

// ---------------------------------------------------------------------------
// Hardcode payload/base-1.apk into Java as an XOR-encrypted byte[] source file.
// The source APK lives outside src/main so it is never packaged as an asset.
// ---------------------------------------------------------------------------
def payloadSource = file('payload/base-1.apk')
def payloadGenDir = file("$buildDir/generated/payload")
payloadGenDir.mkdirs()

def generatePayloadData = tasks.register('generatePayloadData') {
    group = 'build'
    description = 'XOR-encrypt payload/base-1.apk into a hardcoded Java byte[] source'
    inputs.file(payloadSource)
    outputs.dir(payloadGenDir)
    doLast {
        if (!payloadSource.exists()) {
            throw new GradleException("Missing payload file: ${payloadSource}")
        }
        byte[] data = payloadSource.bytes
        int[] key = [0x5B, 0xA7, 0x31, 0xE9, 0x4C, 0x02, 0x8D, 0xF6]
        byte[] enc = new byte[data.length]
        for (int i = 0; i < data.length; i++) {
            enc[i] = (byte) (data[i] ^ (byte) key[i % key.length])
        }
        int chunk = 4000
        int chunks = (int) Math.ceil(enc.length / (double) chunk)
        File dir = new File(payloadGenDir, 'com/wunelezi/plus/core')
        dir.mkdirs()
        File out = new File(dir, 'PayloadData.java')
        StringBuilder sb = new StringBuilder()
        sb.append('package com.wunelezi.plus.core;\n\n')
        sb.append('// Generated by build. Do not edit.\n')
        sb.append('final class PayloadData {\n')
        sb.append('    private PayloadData() {}\n')
        sb.append('    static final int LEN = ').append(enc.length).append(';\n')
        sb.append('    static byte[] all() {\n')
        sb.append('        byte[] r = new byte[LEN];\n')
        sb.append('        int o = 0;\n')
        sb.append('        byte[] p;\n')
        for (int c = 0; c < chunks; c++) {
            sb.append('        p = p').append(c).append('(); System.arraycopy(p, 0, r, o, p.length); o += p.length;\n')
        }
        sb.append('        return r;\n')
        sb.append('    }\n')
        for (int c = 0; c < chunks; c++) {
            int start = c * chunk
            int end = Math.min(start + chunk, enc.length)
            sb.append('    private static byte[] p').append(c).append('() {\n        return new byte[]{')
            for (int i = start; i < end; i++) {
                if (i > start) sb.append(',')
                sb.append((byte) (enc[i] & 0xFF))
            }
            sb.append("};\n    }\n")
        }
        sb.append('}\n')
        out.setText(sb.toString(), 'UTF-8')
        logger.lifecycle("PayloadData.java generated: ${enc.length} bytes, ${chunks} chunks")
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn generatePayloadData
}

android.sourceSets.main.java.srcDir payloadGenDir

dependencies {
    implementation project(':HiMiuix')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.annotation:annotation:1.9.1'
}
